<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AutoDrive - Rent or Buy Cars</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f4f9; }
        header { background: #1e293b; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #38bdf8; text-decoration: none; font-weight: bold; padding: 8px 16px; border: 1px solid #38bdf8; border-radius: 4px; }
        header a:hover { background: #38bdf8; color: #1e293b; }
        .container { padding: 30px; max-width: 1200px; margin: auto; }
        .car-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
        .car-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .car-card img { width: 100%; height: 160px; object-fit: cover; }
        .car-card-body { padding: 15px; }
        .car-card h3 { margin: 10px 0 5px; color: #0f172a; }
        .price { color: #16a34a; font-weight: bold; font-size: 18px; margin-bottom: 12px; }
        .btn-group { display: flex; gap: 8px; }
        .btn-group button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        .btn-rent { background: #0284c7; }
        .btn-buy { background: #16a34a; }
        .section { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 30px; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        form input, form select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .date-field { display: flex; flex-direction: column; font-size: 14px; font-weight: bold; color: #334155; }
        .date-field input { margin-top: 5px; }
        form button { grid-column: span 2; padding: 14px; background: #16a34a; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>AutoDrive Portal</h1>
    <a href="admin.html">Admin Login 🔒</a>
</header>

<div class="container">
    <h2>🚗 Available Cars for Rent or Purchase</h2>
    <div id="carGrid" class="car-grid"></div>

    <div class="section" id="applySection">
        <h2>📝 User Application Form</h2>
        <form id="bookingForm">
            <input type="text" id="userName" placeholder="Your Full Name" required>
            <input type="email" id="userEmail" placeholder="Your Email Address" required>
            <input type="tel" id="userPhone" placeholder="Your Phone Number" required>
            <input type="text" id="carName" placeholder="Selected Car Name" readonly required style="background: #f1f5f9;">

            <select id="bookingType" onchange="toggleDateFields()" required>
                <option value="RENT">RENT (Daily Rate)</option>
                <option value="BUY">BUY (Full Price)</option>
            </select>

            <input type="number" id="price" placeholder="Amount (₹)" required>

            <div class="date-field" id="startDateGroup">
                <label for="startDate">Pick-up Date & Time:</label>
                <input type="datetime-local" id="startDate">
            </div>

            <div class="date-field" id="endDateGroup">
                <label for="endDate">Return Date & Time:</label>
                <input type="datetime-local" id="endDate">
            </div>

            <button type="submit">Submit Application</button>
        </form>
    </div>
</div>

<script>
    function loadCars() {
        fetch('/api/cars')
            .then(res => res.json())
            .then(cars => {
                const grid = document.getElementById('carGrid');
                grid.innerHTML = '';
                cars.forEach(car => {
                    const img = car.imageUrl || 'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=500';
                    grid.innerHTML += `
                            <div class="car-card">
                                <img src="${img}" alt="${car.brand} ${car.name}">
                                <div class="car-card-body">
                                    <h3>${car.brand} ${car.name}</h3>
                                    <div class="price">₹${car.price.toLocaleString()}</div>
                                    <div class="btn-group">
                                        <button class="btn-rent" onclick="selectCar('${car.brand} ${car.name}', 'RENT', ${Math.round(car.price / 500)})">Rent</button>
                                        <button class="btn-buy" onclick="selectCar('${car.brand} ${car.name}', 'BUY', ${car.price})">Buy</button>
                                    </div>
                                </div>
                            </div>
                        `;
                });
            });
    }

    function toggleDateFields() {
        const type = document.getElementById('bookingType').value;
        const startGroup = document.getElementById('startDateGroup');
        const endGroup = document.getElementById('endDateGroup');
        const startInput = document.getElementById('startDate');
        const endInput = document.getElementById('endDate');

        if (type === 'RENT') {
            startGroup.style.display = 'flex';
            endGroup.style.display = 'flex';
            startInput.required = true;
            endInput.required = true;
        } else {
            startGroup.style.display = 'none';
            endGroup.style.display = 'none';
            startInput.required = false;
            endInput.required = false;
            startInput.value = '';
            endInput.value = '';
        }
    }

    function selectCar(name, type, amount) {
        document.getElementById('carName').value = name;
        document.getElementById('bookingType').value = type;
        document.getElementById('price').value = amount;
        toggleDateFields();
        document.getElementById('applySection').scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const booking = {
            userName: document.getElementById('userName').value,
            userEmail: document.getElementById('userEmail').value,
            userPhone: document.getElementById('userPhone').value,
            carName: document.getElementById('carName').value,
            bookingType: document.getElementById('bookingType').value,
            price: parseFloat(document.getElementById('price').value),
            startDate: document.getElementById('startDate').value || "N/A",
            endDate: document.getElementById('endDate').value || "N/A"
        };

        fetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(booking)
        }).then(() => {
            alert('Rental/Purchase Application submitted successfully!');
            document.getElementById('bookingForm').reset();
            toggleDateFields();
        });
    });

    loadCars();
    toggleDateFields();
</script>
</body>
</html>
